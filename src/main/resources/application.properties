spring.application.name=Ejercicio5MyAPIGestor
server.port=8082
spring.datasource.url=jdbc:mariadb://localhost:3306/dbgestor
spring.datasource.username=root
# La contrasena no se guarda en el repositorio: se lee de la variable de entorno SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.dbcp2.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update