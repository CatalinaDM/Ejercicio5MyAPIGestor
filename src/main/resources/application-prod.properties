# Perfil de produccion (activar con --spring.profiles.active=prod)
# Mitigacion CVE-2026-116802/116803/116804 (DOMPurify incluido en swagger-ui 5.34.0):
# la consola Swagger UI no se expone en produccion. La especificacion OpenAPI
# en /v3/api-docs sigue disponible para integraciones.
springdoc.swagger-ui.enabled=false

# Configuracion de conexion 100% mediante variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Prevenir error de metadatos al iniciar
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
